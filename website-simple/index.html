<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Outfit:wght@500;700;800;900&family=Work+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function addSmartAppBannerMeta() {
        // Safari reads this meta tag for Smart App Banner support.
        var appId = "6760129310";
        var appArgument = window.location.href.replace(/,/g, "%2C");
        var content = "app-id=" + appId + ", app-argument=" + appArgument;

        var existing = document.querySelector('meta[name="apple-itunes-app"]');

        if (existing) {
          existing.setAttribute("content", content);
          return;
        }

        var meta = document.createElement("meta");
        meta.setAttribute("name", "apple-itunes-app");
        meta.setAttribute("content", content);
        document.head.appendChild(meta);
      })();
    </script>
    <title>ResiWash</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
